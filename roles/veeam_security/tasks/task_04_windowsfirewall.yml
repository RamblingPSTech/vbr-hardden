---
- name: Enable Windows Firewall Domain Profile
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile
    name: EnableFirewall
    data: 1
    type: dword
    state: present

- name: Enable Windows Firewall Domain Profile Default Inbound Block
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile
    name: DefaultInboundAction
    data: 1
    type: dword
    state: present

- name: Enable Windows Firewall Private Profile
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile
    name: EnableFirewall
    data: 1
    type: dword
    state: present

- name: Enable Windows Firewall Private Profile Default Inbound Block
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile
    name: DefaultInboundAction
    data: 1
    type: dword
    state: present

- name: Enable Windows Firewall Public Profile
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile
    name: EnableFirewall
    data: 1
    type: dword
    state: present

- name: Enable Windows Firewall Public Profile Default Inbound Block
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile
    name: DefaultInboundAction
    data: 1
    type: dword
    state: present

...
