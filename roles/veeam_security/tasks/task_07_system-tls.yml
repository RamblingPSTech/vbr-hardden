---
# Ref: Manage SSL/TLS protocols and cipher suites
# https://learn.microsoft.com/en-us/windows-server/identity/ad-fs/operations/manage-ssl-protocols-in-ad-fs

- name: Disable SSL 2.0 for Client
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 2.0\Client
    name: Enabled
    data: 0
    type: dword
    state: present
- name: Disable Default SSL 2.0 for Client
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 2.0\Client
    name: DisabledByDefault
    data: 1
    type: dword
    state: present
- name: Disable SSL 2.0 for Server
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 2.0\Server
    name: Enabled
    data: 0
    type: dword
    state: present
- name: Disable Default SSL 2.0 for Server
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\SSL 2.0\Server
    name: DisabledByDefault
    data: 1
    type: dword
    state: present
